name: Generate backend lockfile once
on:
  push:
    branches: ["fix/backend-security-0.2"]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.ref == 'refs/heads/fix/backend-security-0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-security-0.2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a real npm lockfile
        working-directory: backend
        run: npm install --package-lock-only
      - name: Commit lockfile if missing or changed
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Generate backend npm lockfile"
          git push origin HEAD:fix/backend-security-0.2
