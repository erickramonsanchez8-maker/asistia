name: ASISTIA Licensing Service CI

on:
  push:
    branches: [main, feature/desktop-licensing]
    paths:
      - 'licensing-service/**'
      - '.github/workflows/licensing-service-ci.yml'
  pull_request:
    paths:
      - 'licensing-service/**'
      - '.github/workflows/licensing-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licensing-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run integration tests
        run: npm test
