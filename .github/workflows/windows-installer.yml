name: ASISTIA Windows installer

on:
  push:
    branches:
      - feature/desktop-licensing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for the local API
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: backend

      - name: Run API and licensing tests
        run: npm test
        working-directory: backend

      - name: Install licensing service dependencies
        run: npm install --no-audit --no-fund
        working-directory: licensing-service

      - name: Test licensing service
        run: npm test
        working-directory: licensing-service

      - name: Prepare standalone Node.js runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'node-runtime.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'node-runtime'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.23.3/node-v22.23.3-win-x64.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path 'backend/runtime' | Out-Null
          Copy-Item (Join-Path $extract 'node-v22.23.3-win-x64/node.exe') 'backend/runtime/node.exe' -Force
          if (!(Test-Path 'backend/runtime/node.exe')) { throw 'No se pudo preparar node.exe.' }

      - name: Install desktop packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/ASISTIA-Setup-*.exe' -ErrorAction SilentlyContinue
          if (!$installer) { throw 'No se generó el instalador de ASISTIA.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASISTIA-Windows-Installer
          path: release/ASISTIA-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
