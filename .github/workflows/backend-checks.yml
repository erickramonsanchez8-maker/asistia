name: ASISTIA backend checks
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Validate JavaScript syntax
        run: node --check src/meal-breaks.js && node --check src/meal-break-routes.js && node --check src/server.js && node --check ../desktop/api-client.js
      - run: npm test
      - name: Test desktop API client
        run: node --test ../desktop/api-client.test.cjs
