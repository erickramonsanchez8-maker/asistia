name: ASISTIA backend checks
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - name: Test desktop API client
        run: node --test ../desktop/api-client.test.cjs
