name: ASISTIA mobile and desktop integration tests

on:
  push:
    branches: [feature/asistia-mobile-0.1]
    paths:
      - "backend/**"
      - "desktop/**"
      - "ASISTIA_Control_de_Asistencia.html"
      - ".github/workflows/asistia-mobile-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "desktop/**"
      - "ASISTIA_Control_de_Asistencia.html"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run backend and mobile tests
        run: npm test
        working-directory: backend
