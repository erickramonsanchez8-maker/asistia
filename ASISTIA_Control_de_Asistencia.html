<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ASISTIA | Control de asistencia</title>
<style>
:root{
  --navy:#0b1f3a;--navy-2:#122a4a;--navy-3:#1a3a63;
  --accent:#1aa6b7;--accent-2:#148a98;--accent-soft:#e6f7f9;
  --surface:#f4f7fb;--card:#ffffff;--line:#d7e0ec;--muted:#5b6b80;--text:#142033;
  --ok:#147a4c;--ok-bg:#e7f6ee;--warn:#9a6b00;--warn-bg:#fff4d6;--err:#b42318;--err-bg:#fdecea;
  --info:#1d4e89;--shadow:0 10px 30px rgba(11,31,58,.08);--radius:16px;--radius-sm:10px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
  --top:64px; --side:272px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0 0 .4em;letter-spacing:-.02em;color:var(--navy)}
p{margin:0 0 1em}
a{color:var(--accent-2)}
.hidden{display:none !important}
.app{min-height:100%}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;z-index:80}
.skip:focus{left:8px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, box-shadow .15s, background .15s, opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(180deg,#1db4c6,#148a98);color:#fff;box-shadow:0 8px 18px rgba(26,166,183,.28)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn-danger{background:var(--err);color:#fff}
.btn-warn{background:#c47d0a;color:#fff}
.btn-sm{padding:8px 11px;border-radius:9px;font-size:14px}
.btn-lg{padding:16px 22px;font-size:1.05rem;min-height:56px;width:100%}
.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:inherit;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:650;font-size:.92rem;color:var(--navy)}
.field .hint{color:var(--muted);font-size:.82rem;font-weight:400}
.field .err{color:var(--err);font-size:.82rem;min-height:1.1em}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none;transition:border .15s, box-shadow .15s
}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(26,166,183,.16)}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:.9rem}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-err{background:var(--err-bg);color:var(--err)}
.badge-info{background:#e8f1fb;color:var(--info)}
.badge-muted{background:#eef2f6;color:var(--muted)}

/* Setup */
.setup{min-height:100vh;display:grid;grid-template-columns:minmax(280px,38%) 1fr;background:var(--navy)}
.setup-side{padding:48px 40px;color:#e8eef7;position:relative;overflow:hidden}
.setup-side:before,.setup-side:after{content:"";position:absolute;border-radius:50%;background:rgba(26,166,183,.18)}
.setup-side:before{width:280px;height:280px;right:-80px;top:-60px}
.setup-side:after{width:180px;height:180px;left:-50px;bottom:40px}
.setup-side h1{color:#fff;font-size:2rem}
.setup-side p{color:#c5d0e0;max-width:36ch}
.progress{display:flex;flex-direction:column;gap:10px;margin-top:36px;position:relative;z-index:1}
.progress-item{display:flex;gap:10px;align-items:center;opacity:.55}
.progress-item.on{opacity:1}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:.8rem;font-weight:700}
.progress-item.on .dot{background:var(--accent);color:#042026}
.setup-main{background:var(--surface);padding:36px;overflow:auto}
.setup-card{max-width:640px;background:#fff;border-radius:22px;padding:28px;box-shadow:var(--shadow);animation:rise .45s ease}
.bar{height:8px;background:#e6edf5;border-radius:99px;overflow:hidden;margin:8px 0 20px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#4fd3df);transition:width .35s}
.wizard-nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}

/* Kiosk */
.kiosk{min-height:100vh;background:
  radial-gradient(1200px 500px at 10% -10%, rgba(26,166,183,.25), transparent 50%),
  radial-gradient(900px 400px at 100% 0%, rgba(20,80,140,.35), transparent 46%),
  linear-gradient(165deg, #071526 0%, #0b1f3a 42%, #12324f 100%);
color:#eaf2fb;display:flex;flex-direction:column;position:relative;overflow:hidden}
.kiosk:before{content:"";position:absolute;inset:auto -80px -120px auto;width:420px;height:420px;border-radius:50%;background:rgba(26,166,183,.08);pointer-events:none}
.kiosk-top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img,.logo-ph{height:48px;border-radius:12px;background:#fff;border:1px solid rgba(255,255,255,.2)}
.brand img{width:auto;max-width:160px;min-width:48px;object-fit:contain;padding:3px;box-sizing:border-box;flex-shrink:0}
.logo-ph{width:48px;display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:1.1rem}
.brand h1{color:#fff;font-size:1.15rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#9db0c7}
.kiosk-actions{display:flex;gap:8px;flex-wrap:wrap}
.kiosk-actions .btn-ghost{color:#fff;border-color:rgba(255,255,255,.2)}
.kiosk-main{flex:1;display:grid;place-items:center;padding:12px 20px 40px;position:relative;z-index:2}
.welcome{width:min(920px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:stretch}
.hero{padding:12px 8px}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(2.8rem,7vw,4.6rem);font-weight:750;letter-spacing:-.04em;line-height:1;color:#fff}
.date-line{margin-top:8px;color:#c5d3e4;font-size:1.05rem}
.greet{margin:18px 0 8px;font-size:1.55rem;color:#fff}
.quote{color:#b9c9db;font-size:1.02rem;max-width:36ch}
.status-chip{margin-top:22px;display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:.92rem}
.panel{background:rgba(255,255,255,.96);color:var(--text);border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.22);position:relative}
.panel h2{font-size:1.15rem}
.search-wrap{position:relative}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;max-height:240px;overflow:auto}
.suggest button{width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.suggest button:hover,.suggest button.active{background:var(--accent-soft)}
.person{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;animation:rise .3s ease}
.person .meta{color:var(--muted);font-size:.88rem}
.kiosk-note{font-size:.8rem;color:var(--muted);margin-top:10px}
.confirm-layer{position:fixed;inset:0;background:rgba(7,18,34,.55);display:grid;place-items:center;z-index:40;padding:20px}
.confirm-card{background:#fff;border-radius:22px;padding:28px;max-width:420px;width:100%;text-align:center;animation:pop .35s ease}
.confirm-card.ok{box-shadow:0 0 0 6px rgba(20,122,76,.12)}
.check-anim{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;color:var(--ok);font-size:2rem}

/* Admin */
.admin{min-height:100vh;display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr}
.topbar{grid-column:1/-1;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;position:sticky;top:0;z-index:20}
.topbar .left,.topbar .right{display:flex;align-items:center;gap:10px;min-width:0}
.hamb{display:none;width:42px;height:42px;border:0;background:transparent;color:#fff}
.side{background:#0e2747;color:#d5e2f0;padding:14px 10px;overflow:auto}
.nav-btn{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;margin-bottom:4px}
.nav-btn:hover,.nav-btn.on{background:rgba(26,166,183,.16);color:#fff}
.nav-btn.on{box-shadow:inset 3px 0 0 var(--accent)}
.main{padding:22px;overflow:auto;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 6px 16px rgba(11,31,58,.04);animation:rise .4s ease}
.kpi b{display:block;font-size:1.7rem;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.grid-2{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 6px 16px rgba(11,31,58,.04)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid #edf2f7;text-align:left;font-size:.92rem;vertical-align:top}
th{position:sticky;top:0;background:#f7fafc;cursor:pointer;white-space:nowrap}
tr:hover td{background:#f9fcff}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters > *{min-width:140px;flex:1}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--navy)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#071526,#0b1f3a 50%,#12324f);padding:20px}
.login-card{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.warn-banner{background:var(--warn-bg);color:#5c4300;border:1px solid #efd48a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.info-banner{background:#e8f1fb;color:var(--info);border:1px solid #c5d8ee;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.err-banner{background:var(--err-bg);color:var(--err);border:1px solid #f3c0bc;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.busy{position:fixed;inset:0;background:rgba(7,18,34,.45);display:grid;place-items:center;z-index:90}
.busy-box{background:#fff;padding:18px 22px;border-radius:14px;font-weight:650;color:var(--navy);box-shadow:var(--shadow)}
.pin-box{margin:10px 0;padding:10px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}

/* Modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(8,18,32,.48);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .25s ease}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);min-width:240px;animation:rise .25s}
.toast.ok{background:#0f5c3a}
.toast.err{background:#8f1d16}
.chart{width:100%;height:220px}

@media (max-width:980px){
  .setup{grid-template-columns:1fr}
  .setup-side{display:none}
  .welcome{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .grid-2,.inline-fields{grid-template-columns:1fr}
  .admin{grid-template-columns:1fr}
  .side{position:fixed;inset:var(--top) auto 0 0;width:min(86vw,280px);transform:translateX(-110%);transition:transform .25s;z-index:19}
  .side.open{transform:none}
  .hamb{display:grid;place-items:center}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr}
  .kiosk-top{padding:12px}
  .main{padding:14px}
  .clock{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ASISTIA visual system: deeper hierarchy, motion with restraint, and responsive brand lockup. */
.asistia-logo-wrap{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:146px;height:48px;padding:4px 8px;background:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.09);overflow:hidden}
.asistia-logo{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.brand .asistia-logo{width:100%;height:100%;max-width:none;min-width:0;padding:0;border:0;border-radius:0;background:transparent}
.setup-brand-card{display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:1;width:min(330px,100%);padding:12px 16px;margin:0 0 28px;background:#fff;border:1px solid rgba(255,255,255,.28);border-radius:17px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.setup-logo{display:block;width:100%;height:auto;max-height:105px;object-fit:contain}
.login-card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.66);box-shadow:0 28px 75px rgba(0,0,0,.22);animation:loginArrival .65s cubic-bezier(.2,.75,.25,1) both}
.login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#102c55,#1d6bd1,#1aa6b7)}
.login-logo{display:block;width:min(240px,85%);max-height:88px;object-fit:contain;margin:0 auto 18px}
.login-eyebrow,.brand-eyebrow{font-size:.72rem;letter-spacing:.18em;font-weight:800;text-transform:uppercase;color:var(--accent-2);margin:0 0 7px}
.login-eyebrow{text-align:center}.login-card h2{text-align:center;font-size:1.65rem;margin-bottom:8px}.login-company{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.kiosk{background-size:130% 130%;animation:kioskAtmosphere 22s ease-in-out infinite alternate}
.kiosk:before{filter:blur(2px);animation:ambientFloat 12s ease-in-out infinite alternate}
.kiosk-top{backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.055)}
.kiosk .brand{animation:brandEnter .7s cubic-bezier(.2,.75,.25,1) both}
.kiosk .brand .asistia-logo-wrap{transition:transform .3s ease,box-shadow .3s ease}
.kiosk .brand .asistia-logo-wrap:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 9px 22px rgba(0,0,0,.18)}
.panel{border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 70px rgba(0,0,0,.23);animation:panelEnter .62s .08s cubic-bezier(.2,.75,.25,1) both}
.hero{animation:heroEnter .68s cubic-bezier(.2,.75,.25,1) both}
.clock{text-shadow:0 8px 26px rgba(0,0,0,.13);font-variant-numeric:tabular-nums}
.status-chip{backdrop-filter:blur(6px);transition:background .25s,border-color .25s}.status-chip:hover{background:rgba(255,255,255,.12);border-color:rgba(127,211,220,.34)}
.btn{position:relative;isolation:isolate;transition:transform .22s cubic-bezier(.2,.75,.25,1),box-shadow .22s,background .22s,border-color .22s}
.btn-primary{overflow:hidden}.btn-primary:after{content:"";position:absolute;z-index:-1;top:-60%;bottom:-60%;left:-45%;width:30%;transform:translateX(-160%) rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transition:transform .65s ease}
.btn-primary:hover:after{transform:translateX(520%) rotate(18deg)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(26,166,183,.32)}.btn-navy:hover{box-shadow:0 9px 20px rgba(11,31,58,.19)}
.nav-btn{position:relative;transition:background .22s,color .22s,transform .22s;padding-left:15px}.nav-btn:hover{transform:translateX(2px)}
.main{animation:mainReveal .42s cubic-bezier(.2,.75,.25,1) both}
.main > .page-head{animation:contentReveal .48s cubic-bezier(.2,.75,.25,1) both}
.main > .warn-banner,.main > .info-banner,.main > .err-banner,.main > .card,.main > .kpis,.main > .grid-2,.main > .table-wrap,.main > .filters{animation:contentReveal .48s cubic-bezier(.2,.75,.25,1) both}
.main > :nth-child(2){animation-delay:.035s}.main > :nth-child(3){animation-delay:.07s}.main > :nth-child(4){animation-delay:.105s}
.kpi{position:relative;overflow:hidden;transition:transform .24s cubic-bezier(.2,.75,.25,1),box-shadow .24s,border-color .24s}
.kpi:after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#67d7e2);opacity:0;transform:scaleX(.5);transform-origin:left;transition:opacity .24s,transform .24s}
.kpi:hover{transform:translateY(-4px);border-color:#b9e3e9;box-shadow:0 15px 28px rgba(11,31,58,.09)}.kpi:hover:after{opacity:1;transform:scaleX(1)}
.kpis .kpi:nth-child(1){animation:contentReveal .48s .02s both}.kpis .kpi:nth-child(2){animation:contentReveal .48s .06s both}.kpis .kpi:nth-child(3){animation:contentReveal .48s .10s both}.kpis .kpi:nth-child(4){animation:contentReveal .48s .14s both}.kpis .kpi:nth-child(5){animation:contentReveal .48s .18s both}.kpis .kpi:nth-child(6){animation:contentReveal .48s .22s both}.kpis .kpi:nth-child(7){animation:contentReveal .48s .26s both}.kpis .kpi:nth-child(8){animation:contentReveal .48s .30s both}
.card,.table-wrap{transition:box-shadow .24s,border-color .24s}.card:hover{border-color:#d1dfec}.table-wrap{box-shadow:0 5px 18px rgba(11,31,58,.025)}
tbody tr{transition:background .16s,box-shadow .16s}tbody tr:hover td{background:#f2f9fc}
input,select,textarea{transition:border-color .18s,box-shadow .18s,background .18s}
.report-builder{border-top:3px solid var(--accent)}.report-actions{padding-top:6px;border-top:1px solid #edf2f7}
@keyframes kioskAtmosphere{0%{background-position:0% 0%}100%{background-position:100% 100%}}
@keyframes ambientFloat{0%{transform:translate3d(0,0,0) scale(.96)}100%{transform:translate3d(-35px,-22px,0) scale(1.05)}}
@keyframes brandEnter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes panelEnter{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
@keyframes heroEnter{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes mainReveal{from{opacity:.65}to{opacity:1}}
@keyframes contentReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes loginArrival{from{opacity:0;transform:translateY(13px) scale(.99)}to{opacity:1;transform:none}}
@media (max-width:640px){.asistia-logo-wrap{width:118px;height:42px;padding:4px 6px}.kiosk .brand{gap:8px}.brand h1{font-size:1rem}.kiosk-actions{gap:5px}.kiosk-actions .btn{padding:8px 9px}.login-logo{width:min(210px,80%)}.report-builder{padding:13px}}
@media (prefers-reduced-motion:reduce){.kiosk,.kiosk:before,.kiosk .brand,.hero,.panel,.main,.main>* ,.kpi,.login-card{animation:none!important}.kpi,.card,.table-wrap,.btn,.nav-btn,.status-chip,.kiosk .brand .asistia-logo-wrap{transition:none!important}}

function uid(prefix){
  return (prefix||"id") + "_" + Math.random().toString(36).slice(2,8) + Date.now().toString(36);
}
function nowIso(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function fold(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
}
function bytesToHex(buf){
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function hexToBytes(hex){
  const a = new Uint8Array(hex.length/2);
  for(let i=0;i<a.length;i++) a[i]=parseInt(hex.substr(i*2,2),16);
  return a;
}
async function sha256(text){
  if(window.crypto && crypto.subtle){
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return bytesToHex(d);
  }
  return simpleHash(text);
}
function simpleHash(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193);} 
  let s=""; for(let i=0;i<8;i++){ s+=((h>>>((i%4)*8))&255).toString(16).padStart(2,"0"); h=Math.imul(h^i,2654435761);} 
  return (s+s).slice(0,64);
}
async function hashSecret(secret, saltHex){
  const salt = saltHex || bytesToHex(crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(16)) : Uint8Array.from({length:16},()=>Math.floor(Math.random()*256)));
  if(window.crypto && crypto.subtle){
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", iterations:80000, salt: hexToBytes(salt)}, key, 256);
    return {hash: bytesToHex(bits), salt};
  }
  let acc = secret+salt;
  for(let i=0;i<5000;i++) acc = await sha256(acc+i);
  return {hash: acc, salt};
}
async function verifySecret(secret, hash, salt){
  const r = await hashSecret(secret, salt);
  return r.hash === hash;
}
function fitLogo(file, maxSide){
  maxSide = maxSide || 320;
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type)){ reject(new Error("Archivo no válido")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
        if(!iw || !ih) throw new Error("Imagen sin tamaño");
        const k = Math.min(1, maxSide/Math.max(iw, ih));
        const w = Math.max(1, Math.round(iw*k)), h = Math.max(1, Math.round(ih*k));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        const jpeg = file.type === "image/jpeg";
        if(jpeg){ ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(jpeg ? c.toDataURL("image/jpeg", 0.88) : c.toDataURL("image/png"));
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen")); };
    img.src = url;
  });
}

function tz(){ return (db && db.company && db.company.timezone) || "America/Mexico_City"; }
function zoned(date){
  const d = date instanceof Date ? date : new Date(date);
  const fmt = new Intl.DateTimeFormat("en-CA", {timeZone: tz(), year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false, weekday:"short"});
  const parts = Object.fromEntries(fmt.formatToParts(d).map(p=>[p.type,p.value]));
  const isoDate = parts.year+"-"+parts.month+"-"+parts.day;
  const seconds = parts.second || "00";
  return {
    date: isoDate,
    time: parts.hour+":"+parts.minute,
    timeSec: parts.hour+":"+parts.minute+":"+seconds,
    hour: +parts.hour, minute:+parts.minute, second:+seconds,
    weekday: new Date(isoDate+"T12:00:00").getDay()
  };
}
function weekdayFromIso(isoDate){
  const [y,m,da] = isoDate.split("-").map(Number);
  return new Date(y, m-1, da).getDay();
}
function formatDateLong(isoDate){
  if(!isoDate) return "—";
  const [y,m,d] = isoDate.split("-").map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function formatDateShort(isoDate){
  if(!isoDate) return "—";
  const [y,m,d] = isoDate.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("es-MX");
}
function formatTime(iso){
  if(!iso) return "—";
  const z = zoned(iso);
  const h = z.hour, m = String(z.minute).padStart(2,"0");
  const ampm = h>=12 ? "p. m." : "a. m.";
  const h12 = (h%12)||12;
  return h12+":"+m+" "+ampm;
}
function formatTimeSec(iso){
  if(!iso) return "—";
  const z = zoned(iso);
  const h = z.hour, m = String(z.minute).padStart(2,"0"), s = String(z.second).padStart(2,"0");
  const ampm = h>=12 ? "p. m." : "a. m.";
  const h12 = (h%12)||12;
  return h12+":"+m+":"+s+" "+ampm;
}
function toLocalInput(iso){

function addDays(isoDate, n){

function employeeName(e){ return (e.displayName || e.fullName || "").trim(); }
function empById(id){ return db.employees.find(x=>x.id===id); }
function schById(id){ return db.schedules.find(x=>x.id===id) || db.schedules[0]; }
function isHoliday(isoDate){ return db.holidays.some(h=>h.date===isoDate); }
function scheduleFor(emp, isoDate){
  const sch = schById(emp && emp.scheduleId);
  if(!sch) return null;
  const wd = weekdayFromIso(isoDate);
  const dayCfg = sch.byDay && sch.byDay[wd];
  const start = (dayCfg && dayCfg.start) || sch.start;
  const end = (dayCfg && dayCfg.end) || sch.end;
  const workDays = emp && emp.workDays && emp.workDays.length ? emp.workDays : sch.workDays;
  const overnight = !!(dayCfg && dayCfg.overnight) || !!sch.overnight || minutesOf(end) <= minutesOf(start);
  return {
    id: sch.id, name: sch.name, start, end, workDays, overnight,
    toleranceMin: sch.toleranceMin|0, breakMin: sch.breakMin|0, snapshotAt: nowIso()
  };
}
function isWorkDay(emp, isoDate){
  if(isHoliday(isoDate)) return false;
  const sch = scheduleFor(emp, isoDate);
  if(!sch) return false;
  return (sch.workDays||[]).map(Number).includes(weekdayFromIso(isoDate));
}
function openSession(empId){
  return db.sessions.find(s=>s.employeeId===empId && s.clockIn && !s.clockOut);
}
function sessionDurationMs(s){
  if(!s || !s.clockIn) return 0;
  const end = s.clockOut ? new Date(s.clockIn) && new Date(s.clockOut) : new Date();
  let a = new Date(s.clockIn).getTime();
  let b = (s.clockOut ? new Date(s.clockOut) : new Date()).getTime();
  if(b < a) b += 24*3600*1000;
  return Math.max(0, b-a);
}
function computeLate(s){
  if(!s || !s.clockIn || !s.scheduleSnapshot || !s.scheduleSnapshot.start) return 0;
  const start = parseLocal(s.operationalDate, s.scheduleSnapshot.start);
  const inAt = new Date(s.clockIn);
  const tol = (s.scheduleSnapshot.toleranceMin|0)*60000;
  const diff = inAt.getTime() - (start.getTime()+tol);
  return diff>0 ? Math.round(diff/60000) : 0;
}
function statusLabel(s){
  if(!s) return {t:"Sin registro", c:"muted"};
  if(s.clockIn && !s.clockOut) return {t:"En jornada", c:"info"};
  if(s.clockIn && s.clockOut) return {t:"Jornada completa", c:"ok"};
  return {t:"Incompleta", c:"warn"};
}

function searchEmployees(q){
  const query = fold(q);
  if(query.length<2) return [];
  const tokens = query.split(" ").filter(Boolean);
  const act = db.employees.filter(e=>e.active);
  const scored = [];
  for(const e of act){
    const full = fold(e.fullName);
    const disp = fold(e.displayName);
    const num = fold(e.employeeNumber);
    const hay = full+" "+disp+" "+num;
    if(tokens.some(t=>t.length>=2 && !hay.includes(t))) continue;
    let score = 0;
    if(full===query || disp===query) score = 100;
    else if(full.startsWith(query) || disp.startsWith(query)) score = 80;
    else if(tokens.every(t=>full.split(" ").some(w=>w.startsWith(t)))) score = 70;
    else if(full.includes(query) || disp.includes(query) || (num && num===query)) score = 50;
    else continue;
    if(query.length<3 && score<80) continue;
    scored.push({e, score});
  }
  scored.sort((a,b)=> b.score-a.score || a.e.fullName.localeCompare(b.e.fullName,"es"));
  return scored.slice(0,8).map(x=>x.e);
}

function actionFor(emp){
  if(!emp) return {type:"none", label:"Identifique al empleado", next:"Escriba su nombre y selecciónelo de la lista."};
  const open = openSession(emp.id);
  if(open) return {type:"out", label:"Registrar salida", next:"Se registrará la salida y se cerrará la jornada abierta."};
  const today = todayIso();
  const closedToday = db.sessions.find(s=>s.employeeId===emp.id && s.operationalDate===today && s.clockIn && s.clockOut);
  if(closedToday && !scheduleFor(emp,today).overnight){
    return {type:"done", label:"Jornada finalizada", next:"Ya registró entrada y salida en esta jornada. No se creará un duplicado."};
  }
  if(closedToday && scheduleFor(emp,today).overnight){
    return {type:"in", label:"Registrar entrada", next:"Se abrirá una nueva jornada."};
  }
  return {type:"in", label:"Registrar entrada", next:"Se registrará la entrada y comenzará su jornada."};
}

function addIncident(type, empId, sessionId, message){
  const rules = db.company.incidentRules || {late:true, open:true, missing:true, overtime:true, correction:true};
  if(type==="late" && rules.late===false) return;
  if(type==="open_exit" && rules.open===false) return;
  if(type==="missing_in" && rules.missing===false) return;
  if(type==="overtime" && rules.overtime===false) return;
  db.incidents.unshift({
    id: uid("inc"), type, employeeId: empId, sessionId, message,
    at: nowIso(), reviewed: false, notes: ""
  });
}

function evaluateAfterPunch(s){
  const late = computeLate(s);
  s.lateMinutes = late;
  if(late>0 && !db.incidents.some(i=>i.sessionId===s.id && i.type==="late")){
    addIncident("late", s.employeeId, s.id, "Entrada con retardo de "+late+" min.");
  }
  if(s.clockOut){
    const sch = s.scheduleSnapshot || {};
    const planned = minutesOf(sch.end) - minutesOf(sch.start);
    let plannedMin = planned;
    if(sch.overnight || planned<=0) plannedMin = planned + 24*60;
    const durMin = Math.round(sessionDurationMs(s)/60000);
    if(plannedMin>0 && durMin > plannedMin + 30){
      addIncident("overtime", s.employeeId, s.id, "La jornada registrada excede la duración configurada ("+durMin+" min). No implica horas extra autorizadas.");
    }
  }
}

async function punch(emp, pin){
  const now = Date.now();
  if(now - ui.lastPunchAt < 1200) return {ok:false, error:"Espere un momento para evitar un registro duplicado."};
  if(db.company.requirePin || (emp.pinHash && db.company.idMethod!=="name_only_forced")){
    if(emp.pinHash){
      if(!pin) return {ok:false, needPin:true};
      const ok = await verifySecret(pin, emp.pinHash, emp.pinSalt);
      if(!ok){
        addIncident("id_error", emp.id, null, "Intento de identificación con PIN incorrecto.");
        saveDb();
        return {ok:false, error:"PIN incorrecto. No se registró asistencia."};
      }
    }
  }
  const act = actionFor(emp);
  if(act.type==="done") return {ok:false, error:"La jornada de hoy ya está cerrada. No se creó un registro duplicado."};
  if(act.type==="none") return {ok:false, error:"Seleccione un empleado válido."};
  ui.lastPunchAt = now;
  const z = zoned(new Date());
  if(act.type==="in"){
    let operationalDate = z.date;
    const sch = scheduleFor(emp, operationalDate);
    if(sch && sch.overnight && minutesOf(z.time) < minutesOf(sch.end)){
      operationalDate = addDays(z.date, -1);
    }
    const snap = scheduleFor(emp, operationalDate);
    const sess = {
      id: uid("ses"),
      employeeId: emp.id,
      operationalDate,
      clockIn: nowIso(),
      clockOut: null,
      scheduleSnapshot: snap,
      lateMinutes: 0,
      source: "kiosk",
      corrected: false,
      corrections: [],
      createdAt: nowIso()
    };
    sess.lateMinutes = computeLate(sess);
    db.sessions.unshift(sess);
    evaluateAfterPunch(sess);
    audit("entrada", employeeName(emp)+" · "+sess.operationalDate);
    const saved = saveDb();
    if(!saved) return {ok:false, error:"No se pudo guardar la entrada. Revise el almacenamiento."};
    return {ok:true, type:"in", session: sess, greet: greeting(z.hour), name: employeeName(emp), time: formatTimeSec(sess.clockIn)};
  }
  const open = openSession(emp.id);
  if(!open) return {ok:false, error:"No hay una jornada abierta para cerrar."};
  const outIso = nowIso();
  if(new Date(outIso) < new Date(open.clockIn) && !(open.scheduleSnapshot && open.scheduleSnapshot.overnight)){
    return {ok:false, error:"La hora de salida no puede ser anterior a la entrada."};
  }
  open.clockOut = outIso;
  open.durationMs = sessionDurationMs(open);
  evaluateAfterPunch(open);
  audit("salida", employeeName(emp)+" · "+open.operationalDate);
  const saved = saveDb();
  if(!saved){
    open.clockOut = null; open.durationMs = null;
    return {ok:false, error:"No se pudo guardar la salida. Revise el almacenamiento."};
  }
  return {ok:true, type:"out", session: open, greet: "Gracias por tu trabajo", name: employeeName(emp), time: formatTimeSec(open.clockOut), duration: durationLabel(open.durationMs), hour: zoned(outIso).hour};
}

function scanOpenIncidents(){
  const rules = db.company.incidentRules || {open:true, missing:true};
  const now = Date.now();
  if(rules.open!==false){
    for(const s of db.sessions){
      if(s.clockIn && !s.clockOut){
        const age = now - new Date(s.clockIn).getTime();
        const exists = db.incidents.some(i=>i.sessionId===s.id && i.type==="open_exit");
        if(age > 14*3600*1000 && !exists){
          addIncident("open_exit", s.employeeId, s.id, "Entrada sin salida después de 14 horas.");
        }
      }
    }
  }
  if(rules.missing!==false){
    const yest = addDays(todayIso(), -1);
    db.employees.filter(e=>e.active && isWorkDay(e,yest)).forEach(e=>{
      const has = db.sessions.some(s=>s.employeeId===e.id && s.operationalDate===yest);
      const exists = db.incidents.some(i=>i.employeeId===e.id && i.type==="missing_in" && i.message.includes(yest));
      if(!has && !exists) addIncident("missing_in", e.id, null, "Falta de entrada el "+yest+" (día laboral sin registro).");
    });
  }
}

function wireKiosk(){
  const input = document.getElementById("qEmp");
  const box = document.getElementById("suggest");
  const drawSuggest = ()=>{
    ui.query = input.value;
    const list = searchEmployees(input.value);
    if(!input.value || list.length===0){
      box.classList.add("hidden");
      box.innerHTML = input.value.trim().length>=2 ? `<button type="button" disabled>No hay empleados activos que coincidan.</button>` : "";
      if(input.value.trim().length>=2) box.classList.remove("hidden");
      return;
    }
    box.classList.remove("hidden");
    box.innerHTML = list.map((e,i)=>{
      const extra = [e.employeeNumber, e.department, e.position].filter(Boolean).join(" · ");
      return `<button type="button" role="option" data-id="${e.id}" class="${i===ui.suggestIndex?"active":""}"><span>${escapeHtml(e.fullName)}${e.displayName && e.displayName!==e.fullName?" <small>("+escapeHtml(e.displayName)+")</small>":""}</span><small>${escapeHtml(extra)}</small></button>`;
    }).join("");
    box.querySelectorAll("button[data-id]").forEach(b=> b.onclick = ()=> selectEmp(b.dataset.id));
  };
  input.addEventListener("input", ()=>{
    ui.selectedEmployeeId = null;
    ui.suggestIndex = 0;
    drawSuggest();
    document.getElementById("personBox").innerHTML = `<p class="hint">Seleccione un resultado para continuar. No se registra asistencia mientras escribe.</p>`;
    document.getElementById("punchBtn").disabled = true;
  });
  input.addEventListener("keydown", (e)=>{
    const list = [...box.querySelectorAll("button[data-id]")];
    if(e.key==="ArrowDown"){ e.preventDefault(); ui.suggestIndex=Math.min(list.length-1,(ui.suggestIndex||0)+1); drawSuggest(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); ui.suggestIndex=Math.max(0,(ui.suggestIndex||0)-1); drawSuggest(); }
    if(e.key==="Enter"){
      e.preventDefault();
      if(list[ui.suggestIndex]) selectEmp(list[ui.suggestIndex].dataset.id);
      else if(ui.selectedEmployeeId) document.getElementById("punchBtn").click();
    }
    if(e.key==="Escape"){ input.value=""; ui.query=""; ui.selectedEmployeeId=null; box.classList.add("hidden"); renderKiosk(); }
  });
  document.getElementById("punchBtn").onclick = onPunch;
  document.getElementById("personBox").addEventListener("keydown", (e)=>{
    if(e.key==="Enter" && e.target && e.target.id==="kioskPin"){ e.preventDefault(); onPunch(); }
  });
  document.getElementById("helpBtn").onclick = showHelp;
  document.getElementById("adminBtn").onclick = ()=>{ ui.mode="admin"; render(); };
}
function selectEmp(id){
  const e = empById(id);
  if(!e || !e.active){ toast("Ese nombre no corresponde a un empleado activo.","err"); return; }
  ui.selectedEmployeeId = id;
  ui.query = e.fullName;
  renderKiosk();
  const pinEl = document.getElementById("kioskPin");
  (pinEl && e.pinHash ? pinEl : document.getElementById("qEmp")).focus();
}
async function onPunch(){
  const emp = empById(ui.selectedEmployeeId);
  if(!emp) return;
  let pin = (document.getElementById("kioskPin")||{}).value || "";
  const need = pinNeeded(emp);
  if(need && emp.pinHash){
    if(!pin){
      const r = await promptBox("Confirme su PIN", `<div class="field"><label>PIN de ${escapeHtml(employeeName(emp))}</label><input name="pin" type="password" inputmode="numeric" required></div>`);
      if(!r) return;
      pin = r.pin;
    }
  } else if(need && !emp.pinHash){
    toast("Este empleado aún no tiene PIN. El administrador debe asignarlo.","err");
    return;
  }
  showBusy("Guardando registro…");
  const res = await punch(emp, pin);
  hideBusy();
  if(!res.ok){ toast(res.error||"No se registró.","err"); return; }
  showPunchSuccess(res);
}
function showPunchSuccess(res){
  const msgIn = `${res.greet}, ${res.name}. Tu jornada comienza ahora. Hoy es una nueva oportunidad para dar lo mejor de ti. Entrada registrada correctamente a las ${res.time}`;
  const msgOut = `¡${res.greet}, ${res.name}! Tu salida quedó registrada a las ${res.time} ${closingWish(res.hour||12)} Duración: ${res.duration}.`;
  document.getElementById("modalRoot").innerHTML = `<div class="confirm-layer"><div class="confirm-card ok">
    <div class="check-anim">✓</div>
    <h3>${res.type==="in"?"Entrada guardada":"Salida guardada"}</h3>
    <p>${escapeHtml(res.type==="in"?msgIn:msgOut)}</p>
    <button class="btn btn-primary" id="okPunch">Listo</button>
  </div></div>`;
  document.getElementById("okPunch").onclick = ()=>{
    closeModal();
    ui.selectedEmployeeId = null; ui.query="";
    renderKiosk();
  };
}

function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(()=>{
    const el = document.getElementById("liveClock");
    if(!el) { clearInterval(clockTimer); return; }
    const z = zoned(new Date());
    el.textContent = db.company.showSeconds!==false ? z.timeSec : z.time;
    const d = document.getElementById("liveDate"); if(d) d.textContent = formatDateLong(z.date);
    const g = document.getElementById("liveGreet"); if(g) g.textContent = greeting(z.hour);
    const emp = empById(ui.selectedEmployeeId);
    if(emp){
      const info = document.getElementById("personInfo");
      if(info) info.innerHTML = renderPersonInfo(emp, actionFor(emp));
    }
  }, 1000);
}

function statsForDate(isoDate){
  const active = db.employees.filter(e=>e.active);
  const daySess = db.sessions.filter(s=>s.operationalDate===isoDate);
  const inCount = daySess.filter(s=>s.clockIn).length;
  const working = daySess.filter(s=>s.clockIn && !s.clockOut).length;
  const outCount = daySess.filter(s=>s.clockOut).length;
  const pending = active.filter(e=> isWorkDay(e,isoDate) && !daySess.some(s=>s.employeeId===e.id)).length;
  const lates = daySess.filter(s=>s.lateMinutes>0).length;
  const incomplete = daySess.filter(s=>s.clockIn && !s.clockOut).length;
  const hours = daySess.reduce((a,s)=>a+sessionDurationMs(s),0);
  return {active: active.length, inCount, working, outCount, pending, lates, incomplete, hours};
}

function filteredSessions(base){
  const f = Object.assign({from:"",to:"",employeeId:"",department:"",status:"",q:""}, base||{});
  let list = db.sessions.slice();
  if(f.from) list = list.filter(s=>s.operationalDate>=f.from);
  if(f.to) list = list.filter(s=>s.operationalDate<=f.to);
  if(f.employeeId) list = list.filter(s=>s.employeeId===f.employeeId);
  if(f.department) list = list.filter(s=>{ const e=empById(s.employeeId); return e && e.department===f.department; });
  if(f.status==="open") list = list.filter(s=>s.clockIn && !s.clockOut);
  if(f.status==="closed") list = list.filter(s=>s.clockIn && s.clockOut);
  if(f.status==="late") list = list.filter(s=>s.lateMinutes>0);
  if(f.status==="corrected") list = list.filter(s=>s.corrected);
  if(f.q){
    const q = fold(f.q);
    list = list.filter(s=>{ const e=empById(s.employeeId); return e && (fold(e.fullName).includes(q)||fold(e.employeeNumber).includes(q)); });
  }
  const key = ui.sort.key, dir = ui.sort.dir==="asc"?1:-1;
  list.sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(key==="name"){ va=employeeName(empById(a.employeeId)||{}); vb=employeeName(empById(b.employeeId)||{}); }
    if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0;
  });
  return list;
}

function openEmpEditor(id){

    ev.preventDefault();
    const fd = new FormData(ev.target);
    const fullName = String(fd.get("fullName")||"").trim();
    if(fullName.length<3){ document.querySelector("[data-err=fullName]").textContent="Escriba el nombre completo."; return; }
    const employeeNumber = String(fd.get("employeeNumber")||"").trim();
    if(employeeNumber && db.employees.some(x=>x.employeeNumber===employeeNumber && x.id!==id)){
      toast("Ese número de empleado ya existe.","err"); return;
    }
    const workDays = [...ev.target.querySelectorAll("[name=workDays]:checked")].map(i=>+i.value);
    const pin = String(fd.get("pin")||"");
    if(pin && !/^\d{4,8}$/.test(pin)){ toast("El PIN debe tener de 4 a 8 dígitos.","err"); return; }
    if(e){
      e.fullName=fullName; e.displayName=String(fd.get("displayName")||"").trim();
      e.employeeNumber=employeeNumber; e.position=String(fd.get("position")||"").trim();
      e.department=String(fd.get("department")||"").trim(); e.hireDate=String(fd.get("hireDate")||"");

    } else {
      const ne = {
        id: uid("emp"), fullName, displayName:String(fd.get("displayName")||"").trim(),
        employeeNumber, position:String(fd.get("position")||"").trim(),
        department:String(fd.get("department")||"").trim(), hireDate:String(fd.get("hireDate")||todayIso()),

function reportRange(){
  const type = document.getElementById("rt") ? document.getElementById("rt").value : ui.report.type;
  const today = todayIso();
  let from = document.getElementById("rf")?.value || today;
  let to = document.getElementById("rto")?.value || today;
  if(type==="day"){ from=to=from; }
  if(type==="week"){
    const [y,m,d] = from.split("-").map(Number);
    const dt = new Date(y,m-1,d);
    const day = dt.getDay(); const diff = (day+6)%7;
    dt.setDate(dt.getDate()-diff);
    from = dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
    const e = new Date(dt); e.setDate(e.getDate()+6);
    to = e.getFullYear()+"-"+pad(e.getMonth()+1)+"-"+pad(e.getDate());
  }
  if(type==="month"){
    from = from.slice(0,7)+"-01";
    const [y,m] = from.split("-").map(Number);
    const last = new Date(y,m,0).getDate();
    to = from.slice(0,7)+"-"+pad(last);
  }
  if(type==="quincena"){
    const q = quincenaRange(from||today);
    from = q.from; to = q.to;
  }
  if(type==="all"){
    const dates = db.sessions.map(s=>s.operationalDate).sort();
    from = dates[0]||today; to = dates[dates.length-1]||today;
  }
  return {
    from, to, type,
    employeeId: document.getElementById("re")?.value || "",
    department: document.getElementById("rd")?.value.trim() || "",
    status: document.getElementById("rs")?.value || ""
  };
}
function buildReportData(f){
  const list = filteredSessions(f);
  const emps = [...new Set(list.map(s=>s.employeeId))];
  const hours = list.reduce((a,s)=>a+sessionDurationMs(s),0);
  return {
    list, emps,
    entradas: list.filter(s=>s.clockIn).length,
    full: list.filter(s=>s.clockIn && s.clockOut).length,
    incomplete: list.filter(s=>!s.clockOut || !s.clockIn).length,
    late: list.filter(s=>s.lateMinutes>0).length,
    hours,
    payroll: payrollSummary(f, list)
  };
}
function payrollSummary(f, list){
  const ids = [...new Set(db.employees.filter(e=>!f.employeeId || e.id===f.employeeId).filter(e=>!f.department || e.department===f.department).map(e=>e.id))];
  const dates = eachDate(f.from, f.to);
  return ids.map(id=>{
    const e = empById(id); if(!e) return null;
    const mine = (list||[]).filter(s=>s.employeeId===id);
    const hours = mine.reduce((a,s)=>a+sessionDurationMs(s),0);
    const lates = mine.filter(s=>s.lateMinutes>0).length;
    const lateMin = mine.reduce((a,s)=>a+(s.lateMinutes||0),0);
    const incomplete = mine.filter(s=>s.clockIn && !s.clockOut).length;
    let faltas = 0;
    dates.forEach(d=>{ if(e.active && isWorkDay(e,d) && !mine.some(s=>s.operationalDate===d)) faltas++; });
    return {e, hours, lates, lateMin, incomplete, faltas, days: mine.length};
  }).filter(Boolean);
}

 <div class="article" style="padding-top:12px">
 <h4>I. Objeto y funcionamiento</h4><p>ASISTIA se utiliza para registrar y consultar eventos de inicio y fin de jornada, administrar incidencias y solicitudes de corrección y generar reportes de asistencia. La persona trabajadora debe registrar personalmente sus marcas, cuidar sus credenciales y no marcar por otra persona. El sistema puede guardar fecha/hora del evento, hora de recepción, empleado, sucursal, tipo de evento y trazas de seguridad según la modalidad y configuración.</p>

 <h4>VI. Acuerdo laboral</h4><p>Las partes hacen constar que conocen el funcionamiento descrito y acuerdan utilizar el registro electrónico de jornada conforme a la legislación aplicable, incluido el artículo 132, fracción XXXIV, de la Ley Federal del Trabajo, cuando resulte aplicable. Este documento no implica renuncia a salarios, descansos, privacidad ni otros derechos irrenunciables. Los cambios materiales de finalidad o de sistema deben comunicarse y documentarse.</p>
 <h4>VII. Constancia</h4><p>La persona trabajadora declara que tuvo oportunidad de leer, preguntar y recibir copia. La aceptación en esta aplicación es una constancia local de lectura y acuerdo; no sustituye una firma autógrafa o electrónica válida ni la revisión jurídica. La empresa debe completar los datos de privacidad y validar este documento antes de usarlo.</p>
 </div></details></div>

function checkDataConsistency(){
 const errors=[];
 const check=(list,label)=>{const ids=new Set();(list||[]).forEach(x=>{if(!x.id)errors.push(label+": registro sin identificador.");else if(ids.has(x.id))errors.push(label+": identificador duplicado "+x.id);else ids.add(x.id);});};
 check(db.employees,"Empleados");check(db.sessions,"Jornadas");check(db.audit,"Auditoría");check(db.incidents,"Incidencias");check(db.complianceAgreements||[],"Constancias");
 (db.sessions||[]).forEach(x=>{if(x.clockIn&&Number.isNaN(Date.parse(x.clockIn)))errors.push("Jornada "+x.id+": entrada inválida.");if(x.clockOut&&Number.isNaN(Date.parse(x.clockOut)))errors.push("Jornada "+x.id+": salida inválida.");if(x.clockIn&&x.clockOut&&Date.parse(x.clockOut)<Date.parse(x.clockIn))errors.push("Jornada "+x.id+": salida anterior a entrada.");});
 return {ok:errors.length===0,errors};
}
async function exportComplianceEvidence(){
 const payload={format:"ASISTIA-COMPLIANCE-EVIDENCE-1.0",exportedAt:nowIso(),company:{name:db.company.name,timezone:tz()},notice:"Expediente para revisión; no es certificación de cumplimiento ni prueba por sí solo de autenticidad de origen.",sessions:db.sessions,employees:db.employees.map(e=>({id:e.id,employeeNumber:e.employeeNumber,fullName:e.fullName,active:e.active,department:e.department,position:e.position})),incidents:db.incidents,audit:db.audit,agreements:db.complianceAgreements||[],consistency:checkDataConsistency()};
 let digest=null;if(window.crypto&&crypto.subtle){try{digest=bytesToHex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify(payload))));}catch(e){}}
 const out={...payload,integrity:{algorithm:digest?"SHA-256":null,digest,scope:"Huella de la copia exportada; no certifica la veracidad de origen."}};
 downloadBlob(JSON.stringify(out,null,2),"ASISTIA_Expediente_"+safeName(db.company.name)+"_"+todayIso()+".json","application/json;charset=utf-8");
 audit("export_expediente","Expediente exportado; SHA-256: "+(digest||"no disponible"));saveDb();toast(digest?"Expediente exportado con huella SHA-256.":"Expediente exportado sin huella criptográfica.",digest?"ok":"");
}

function drawChart(){
  const c = document.getElementById("chartW"); if(!c) return;
  const ctx = c.getContext("2d");
  const w = c.width = c.clientWidth * (window.devicePixelRatio||1);
  const h = c.height = 220 * (window.devicePixelRatio||1);
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  const W = c.clientWidth, H=220;
  ctx.clearRect(0,0,W,H);
  const days=[];
  for(let i=6;i>=0;i--) days.push(addDays(todayIso(),-i));
  const vals = days.map(d=> db.sessions.filter(s=>s.operationalDate===d && s.clockIn).length);
  const max = Math.max(1,...vals);
  ctx.strokeStyle="#d7e0ec"; ctx.beginPath(); ctx.moveTo(36,10); ctx.lineTo(36,H-28); ctx.lineTo(W-8,H-28); ctx.stroke();
  if(db.sessions.length===0){
    ctx.fillStyle="#5b6b80"; ctx.fillText("Sin registros todavía. Las barras aparecerán con datos reales.", 48, H/2);
    return;
  }
  const bw = (W-56)/7;
  vals.forEach((v,i)=>{
    const x = 44+i*bw, barh = (v/max)*(H-60);
    ctx.fillStyle="#1aa6b7";
    ctx.fillRect(x, H-28-barh, bw*0.6, barh);
    ctx.fillStyle="#142033";
    ctx.fillText(String(v), x, H-32-barh);
    ctx.fillStyle="#5b6b80";
    ctx.fillText(days[i].slice(8), x, H-10);
  });
}

async function correctSession(id){
  const s = db.sessions.find(x=>x.id===id); if(!s) return;
  const e = empById(s.employeeId)||{};
  const inVal = toLocalInput(s.clockIn);
  const outVal = toLocalInput(s.clockOut);
  const r = await promptBox("Corrección administrativa", `
    <p>Registro original de ${escapeHtml(employeeName(e))} el ${formatDateShort(s.operationalDate)}.</p>
    <p>Entrada original: ${formatTimeSec(s.clockIn)} · Salida original: ${s.clockOut?formatTimeSec(s.clockOut):"sin salida"}</p>
    <div class="field"><label>Nueva entrada (hora local del dispositivo)</label><input type="datetime-local" name="cin" value="${inVal}" required></div>
    <div class="field"><label>Nueva salida (vacío = dejar abierta)</label><input type="datetime-local" name="cout" value="${outVal}"></div>
    <div class="field"><label>Motivo obligatorio</label><textarea name="reason" required minlength="5"></textarea></div>`);
  if(!r) return;
  if(!r.reason || r.reason.trim().length<5){ toast("El motivo es obligatorio.","err"); return; }
  const ok = await confirmBox("Confirmar corrección","Se conservará el valor anterior y quedará constancia en auditoría.","Guardar corrección");
  if(!ok) return;
  const before = JSON.stringify({in:s.clockIn,out:s.clockOut});
  s.clockIn = new Date(r.cin).toISOString();
  s.clockOut = r.cout ? new Date(r.cout).toISOString() : null;
  if(s.clockOut && new Date(s.clockOut)<new Date(s.clockIn) && !(s.scheduleSnapshot&&s.scheduleSnapshot.overnight)){
    toast("La salida no puede ser anterior a la entrada.","err");
    const prev = JSON.parse(before); s.clockIn=prev.in; s.clockOut=prev.out; return;
  }
  s.corrected = true; s.source = s.source||"kiosk";
  s.durationMs = s.clockOut ? sessionDurationMs(s) : null;
  s.lateMinutes = computeLate(s);
  s.corrections = s.corrections||[];
  const after = JSON.stringify({in:s.clockIn,out:s.clockOut});
  s.corrections.push({at: nowIso(), by: db.company.adminName, reason: r.reason.trim(), before, after});
  addIncident("correction", s.employeeId, s.id, "Corrección administrativa: "+r.reason.trim());
  audit("correccion", employeeName(e)+" · "+r.reason.trim());
  saveDb(); toast("Corrección guardada. El original quedó en el historial.","ok"); renderAdmin();
}

    try{ parsed = JSON.parse(await file.text()); }
    catch(err){ toast("El archivo no es un JSON válido. No se importó nada.","err"); return; }
    if(!parsed || parsed.version!==VERSION || !parsed.company || !Array.isArray(parsed.employees) || !Array.isArray(parsed.sessions)){
      toast("Formato incompatible. Se esperaba un respaldo de ASISTIA v1.","err"); return;
    }
    const mode = await promptBox("Cómo importar", `<p>El archivo parece válido (${parsed.employees.length} empleados, ${parsed.sessions.length} jornadas).</p>
      <div class="field"><label>Modo</label><select name="mode"><option value="merge">Fusionar: conservar existentes, agregar nuevos</option><option value="replace">Reemplazar todo</option></select></div>`);
    if(!mode) return;
    if(mode.mode==="replace"){
      const ok = await confirmBox("Reemplazar datos","Se sustituirá la información actual de este navegador. Si no tiene otro respaldo, no podrá deshacerlo.","Reemplazar", true);
      if(!ok) return;
      db = parsed; saveDb(); toast("Datos reemplazados.","ok"); render(); return;
    }
    const idx = (arr,id)=>arr.find(x=>x.id===id);
    const merge = (target, incoming)=>{
      incoming.forEach(item=>{ if(!item || !item.id) return; if(!idx(target,item.id)) target.push(item); });
    };
    merge(db.employees, parsed.employees);
    merge(db.sessions, parsed.sessions);
    merge(db.schedules, parsed.schedules||[]);
    merge(db.incidents, parsed.incidents||[]);
    merge(db.audit, parsed.audit||[]);
    parsed.holidays && parsed.holidays.forEach(h=>{ if(!db.holidays.some(x=>x.date===h.date)) db.holidays.push(h); });
    audit("importacion", "fusión de respaldo"); saveDb(); toast("Fusión terminada. Los IDs existentes no se duplicaron.","ok"); renderAdmin();
  };
  document.getElementById("resetApp").onclick = async ()=>{
    const backupFirst = await confirmBox("Restablecer aplicación","Se borrará la configuración, empleados y asistencia de este navegador. ¿Desea descargar un respaldo antes?","Descargar respaldo y continuar");
    if(backupFirst){
      db.meta.lastBackup = nowIso();
      downloadBlob(JSON.stringify(db,null,2), `Respaldo_antes_de_reset_${todayIso()}.json`, "application/json");
    } else {
      const sure = await confirmBox("Continuar sin respaldo","Confirme que desea borrar todo.","Borrar todo", true);
      if(!sure) return;
    }
    const last = await confirmBox("Confirmación final","Esta acción no se puede deshacer en el navegador.","Restablecer", true);
    if(!last) return;
    localStorage.removeItem(KEY);
    sessionStorage.removeItem(SESSION_KEY);
    db = emptyDb(); ui.mode="kiosk"; ui.wizard={}; ui.wizardStep=0;
    toast("Aplicación restablecida. Configure la empresa de nuevo.");
    render();
  };
}

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape") closeModal();
});

try{
  loadDb();
  if(typeof localStorage !== "undefined"){
    const t="__cap_test__"; localStorage.setItem(t,"1"); localStorage.removeItem(t);
  }
}catch(e){
  storageOk=false; storageMsg="Este navegador no permite guardar datos en el contexto actual. Exporte respaldos y abra el archivo mediante un servidor local sencillo. Consulte LEEME.txt.";
  showStorageBanner();
}
render();
})();
</script>
